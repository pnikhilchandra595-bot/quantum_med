name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Run Black Formatter Check
        run: |
          black --check --line-length 100 src app tests cli.py

      - name: Run Isort Import Check
        run: |
          isort --check --profile black src app tests cli.py

      - name: Run Flake8 Linter
        run: |
          flake8 --max-line-length 100 --extend-ignore=E203,W503,E501 src app tests cli.py

  test-suite:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install PyTorch CPU & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Test CLI Interface
        run: |
          python cli.py --help
          python cli.py train --model svm --dataset wdbc --qubits 4
          python cli.py predict --model checkpoints/svm_wdbc.joblib --input data/sample_patient.json

  docker-build:
    name: Docker Image Build & Sanity
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-suite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: quantumhealth/hybrid-qml:test
